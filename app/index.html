<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CGU Treino</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0f1419;color:#e6edf3;font:15px/1.55 "Segoe UI",Arial,sans-serif}
header{display:flex;align-items:center;gap:6px;padding:10px 18px;background:#161b22;border-bottom:1px solid #30363d;position:sticky;top:0;z-index:5}
header b{color:#58a6ff;margin-right:14px;font-size:17px}nav button{background:none;border:0;color:#8b949e;padding:8px 14px;border-radius:6px;cursor:pointer;font:600 14px inherit}nav button.on{background:#1f6feb33;color:#79c0ff}
main{max-width:1000px;margin:0 auto;padding:22px 18px 80px}h2{color:#58a6ff;margin:0 0 12px}h3{color:#7ee787;margin:20px 0 8px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}.card{background:#161b22;border:1px solid #30363d;border-radius:8px;padding:12px;color:#8b949e;font-size:12px}.card b{display:block;font-size:26px;color:#e6edf3}
table{border-collapse:collapse;width:100%;font-size:13.5px;margin:6px 0 14px}th{background:#1f6feb33;color:#79c0ff;text-align:left}td,th{border:1px solid #30363d;padding:6px 9px;vertical-align:top}
.tagok{color:#3fb950;font-size:13px}.bar{height:8px;background:#21262d;border-radius:4px;overflow:hidden;min-width:80px}.bar i{display:block;height:8px;background:#3fb950}.bar i.r{background:#f85149}
button.p,a.btn{background:#238636;color:#fff;border:0;border-radius:6px;padding:7px 14px;cursor:pointer;font:600 14px inherit;text-decoration:none;display:inline-block}button.s{background:#21262d;color:#e6edf3;border:1px solid #30363d;border-radius:6px;padding:7px 14px;cursor:pointer;font:600 14px inherit}
input,select{background:#0d1117;color:#e6edf3;border:1px solid #30363d;border-radius:6px;padding:7px 10px;font:14px inherit}
.q{background:#161b22;border:1px solid #30363d;border-radius:10px;padding:16px 18px;margin:10px 0}.tg span{display:inline-block;background:#1f6feb33;color:#79c0ff;border-radius:8px;padding:0 8px;font-size:12px;margin:0 5px 4px 0}.tg .t{background:#d2992233;color:#e3b341}
.enun{font-size:17px;margin:10px 0 16px}.meta{font-size:12px;color:#8b949e;word-break:break-all}.row{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0}
.row button{flex:1;min-width:120px;padding:12px;font-size:16px}.c{background:#1a7f37!important}.e{background:#b62324!important}.b{background:#484f58!important}
.ok{border-left:4px solid #3fb950;background:#0f2a18;padding:10px 14px;border-radius:6px;margin-top:10px}.no{border-left:4px solid #f85149;background:#2d1517;padding:10px 14px;border-radius:6px;margin-top:10px}.bl{border-left:4px solid #8b949e;background:#1c2128;padding:10px 14px;border-radius:6px;margin-top:10px}
.muted{color:#8b949e;font-size:13px}pre{background:#161b22;border:1px solid #30363d;border-radius:6px;padding:10px;font-size:12px;color:#ffa657;white-space:pre-wrap;max-height:240px;overflow:auto}
.sim{background:#3d1f1f;border:1px solid #f85149;border-radius:8px;padding:8px 12px;margin:8px 0;color:#ffb3ad;font-size:13px}

.et{display:flex;gap:12px;background:#161b22;border:1px solid #30363d;border-radius:8px;padding:10px 14px;margin:8px 0;align-items:flex-start}.et .n{font:700 18px inherit;color:#58a6ff;min-width:22px}.et.claude{border-left:4px solid #bc8cff}.et.mecanica{border-left:4px solid #3fb950}
.tag{font-size:11px;padding:1px 7px;border-radius:8px;background:#21262d;color:#8b949e}.tag.ok{background:#0f2a18;color:#3fb950}.tag.erro{background:#2d1517;color:#f85149}.tag.rodando{background:#3d2f00;color:#d29922}
#log,.chatbox{background:#010409;border:1px solid #30363d;border-radius:8px;padding:10px;font:12.5px/1.5 Consolas,monospace;height:300px;overflow:auto;white-space:pre-wrap}
.l-agente{color:#bc8cff}.l-skill{color:#f778ba}.l-ferramenta{color:#79c0ff}.l-negado{color:#f85149}.l-custo{color:#d29922}.l-fase{color:#7ee787}.l-texto{color:#e6edf3}
.msg{margin:8px 0;padding:8px 12px;border-radius:8px;background:#161b22;font:14px/1.5 "Segoe UI",sans-serif;white-space:pre-wrap}.msg.eu{background:#1f6feb33}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 4px;max-height:210px;overflow:auto}.chip{background:#21262d;color:#c9d1d9;border:1px solid #30363d;border-radius:14px;padding:3px 11px;font:12.5px inherit;cursor:pointer}.chip.tem{border-color:#2ea043;color:#7ee787}.chip:hover{background:#1f6feb33;border-color:#58a6ff}.chip.on{background:#1f6feb;color:#fff;border-color:#58a6ff}
.lv-info{color:#c9d1d9}.lv-ok{color:#3fb950}.lv-aviso{color:#d29922}.lv-erro{color:#f85149}.lh{color:#6e7681}.mini{display:inline-block;width:64px;height:6px;background:#21262d;border-radius:3px;vertical-align:middle;overflow:hidden}.mini i{display:block;height:6px;background:#3fb950}#log{height:340px}.loading{max-width:520px;margin:70px auto;text-align:center;background:#161b22;border:1px solid #30363d;border-radius:12px;padding:24px 22px}.loading .spin{width:30px;height:30px;border:3px solid #30363d;border-top-color:#58a6ff;border-radius:50%;animation:girando .8s linear infinite;margin:0 auto 12px}.loading .track{height:6px;background:#21262d;border-radius:4px;overflow:hidden;margin:14px 0 8px}.loading .track i{display:block;width:38%;height:100%;background:linear-gradient(90deg,#58a6ff,#a371f7);animation:carregando 1.25s ease-in-out infinite}@keyframes girando{to{transform:rotate(360deg)}}@keyframes carregando{0%{transform:translateX(-120%)}100%{transform:translateX(310%)}}
</style><style>.exec-summary{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px}.exec-summary details{flex-basis:100%}.exec-summary summary{cursor:pointer;color:#79c0ff}
.rec-aula{background:#0d1b2a;border:1px solid #1f6feb55;border-left:3px solid #1f6feb;border-radius:8px;padding:10px 12px;margin:10px 0}
.rec-aula.sem-aula{border-color:#d2992255;border-left-color:#d29922;background:#1a1300}
.rec-titulo{font-size:13px;font-weight:700;color:#79c0ff;margin-bottom:6px}
.rec-aula.sem-aula .rec-titulo{color:#d29922}
.rec-nucleo{font-size:12px;color:#8b949e;margin-bottom:8px;font-style:italic}
.rec-item{display:flex;align-items:center;justify-content:space-between;padding:5px 0;border-top:1px solid #21262d}
.rec-item:first-of-type{border-top:none}
.rec-aula-nome{font-size:13px;color:#c9d1d9;flex:1}
.rec-aula-links{display:flex;gap:6px;flex-shrink:0}
.rec-link{font-size:12px;padding:3px 10px;border-radius:6px;border:1px solid #30363d;background:#21262d;color:#58a6ff;text-decoration:none;white-space:nowrap}
.rec-link:hover{background:#1f6feb33;border-color:#58a6ff}
</style></head><body>
<header><b>CGU Treino</b><nav id="nav"></nav><span style="flex:1"></span><span id="ver" class="tag" title="Versão do app (sobe a cada atualização)">v?</span><button class="s" onclick="reiniciar()" title="Reinicia o servidor (use após atualizações)">⟳ Reiniciar</button><button class="s" onclick="encerrar()" title="Desliga o app">⏻ Encerrar</button></header><main id="m"></main>
<script>
const $=s=>document.querySelector(s),m=$('#m');
const H=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const api=async(u,o)=>(await fetch(u,o)).json();
const post=(u,d)=>api(u,{method:'POST',body:JSON.stringify(d)});
const tabs=[['painel','Painel'],['treino','Treino'],['progresso','Progresso'],['programa','Programa'],['edital','Edital'],['universo','Provas'],['workflow','Workflow'],['aulas','Aulas'],['prioridade','Prioridade'],['tec','TEC'],['banco','Banco'],['como','Como funciona']];
const LOAD_MSG={prioridade:'calculando incidência, confiança e fila de estudo',universo:'montando o universo de provas',workflow:'consolidando o workflow',aulas:'checando aulas e cobertura',progresso:'calculando seu progresso',treino:'montando o treino de hoje',edital:'lendo a árvore do edital'};
function loading(t){m.innerHTML=`<div class="loading" role="status" aria-live="polite"><div class="spin"></div><b>${H(LOAD_MSG[t]||'carregando dados')}</b><div class="track"><i></i></div><div class="muted">A app está processando os dados; esta etapa pode levar alguns segundos.</div></div>`}
function nav(t){$('#nav').innerHTML=tabs.map(([k,n])=>`<button class="${k==t?'on':''}" onclick="go('${k}')">${n}</button>`).join('')}
let NOMES={};const RT=s=>(NOMES[s]||{}).r||s,RC=s=>(NOMES[s]||{}).c||s;const capi=s=>String(s||'').charAt(0)+String(s||'').slice(1).toLowerCase();
let CUR='painel',VOLTA='treino';const NOMEABA=t=>(tabs.find(x=>x[0]==t)||[t,t])[1];
async function go(t){CUR=t;for(let i=0;i<4;i++){try{const n=await api('/api/nomes');if(n&&!n.erro&&Object.keys(n).length){NOMES=n;break}}catch(e){}await new Promise(r=>setTimeout(r,500))}try{history.replaceState(null,'','#'+t)}catch(e){}nav(t);m.innerHTML='<p class="muted">carregando…</p>';try{await({painel,treino,progresso,programa,edital,universo,workflow,aulas,prioridade,tec,banco,como})[t]()}catch(e){m.innerHTML='<h2>Erro nesta aba</h2><pre>'+H(e&&e.message||e)+'</pre><p class="muted">Se disser que algo é undefined, o servidor está desatualizado: feche e abra o iniciar.bat.</p>'}}
const _go_original=go;go=async t=>{loading(t);const guard=setInterval(()=>{if(m.textContent.includes('carregando…'))loading(t)},120);try{const r=await _go_original(t);if(t==='prioridade')history.replaceState(null,'','#prioridade/'+PRI.b+'/'+PRI.n);setTimeout(compactarExecucao,0);return r}finally{clearInterval(guard)}};
const pct=(a,b)=>b?Math.round(100*a/b):0;
async function painel(){const r=await api('/api/resumo');const est=Object.entries(r.provas);const tot=est.reduce((s,[,n])=>s+n,0);
// Busca o último acesso para card de retomada
let retomar=null;try{const rt=await api('/api/retomar');if(rt&&rt.url&&rt.ts){const ts=new Date(rt.ts);const ago=Math.round((Date.now()-ts)/60000);const agoStr=ago<60?ago+' min atrás':ago<1440?Math.round(ago/60)+' h atrás':Math.round(ago/1440)+' dia(s) atrás';retomar={url:rt.url,titulo:rt.titulo||'Aula',agoStr}}}catch(e){}
m.innerHTML=`<h2>Painel</h2>${retomar?`<div style="background:#1f6feb22;border:1px solid #58a6ff55;border-radius:10px;padding:12px 16px;margin:0 0 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap"><span style="font-size:22px">↩</span><div style="flex:1;min-width:0"><b style="color:#58a6ff">Continue de onde parou</b><div style="color:#8b949e;font-size:13px;margin-top:2px">${H(retomar.titulo)} · ${retomar.agoStr}</div></div><a href="${retomar.url}" style="background:#1f6feb;color:#fff;border:0;border-radius:8px;padding:9px 18px;font:700 13px sans-serif;text-decoration:none;white-space:nowrap">Retomar →</a></div>`:''}<div class="cards"><div class="card"><b>${r.itens}</b>itens no banco</div><div class="card"><b>${r.nucleos}</b>núcleos</div><div class="card"><b>${r.respondidas}</b>itens respondidos</div><div class="card"><b>${r.pontos}</b>nota líquida (+1/−1)</div><div class="card"><b>${r.aulas_lidas}</b>aulas lidas</div></div>
<h3>Provas por etapa do workflow</h3><table><tr><th>Estado</th><th>Provas</th><th></th></tr>${est.map(([e,n])=>`<tr><td>${H(e)}</td><td>${n}</td><td><div class="bar"><i style="width:${pct(n,tot)}%"></i></div></td></tr>`).join('')}</table>
<h3>Itens por seção do edital</h3><table><tr><th>Seção</th><th>Itens</th><th></th></tr>${r.secoes.map(([s,n])=>`<tr><td>${H(RT(s))}</td><td>${n}</td><td><div class="bar"><i style="width:${pct(n,r.itens)}%"></i></div></td></tr>`).join('')}</table>
<h3>Últimas linhas do log</h3><pre>${H(r.log.join('\n')||'(sem log)')}</pre>`}

async function reiniciar(){if(!confirm('Reiniciar o servidor? Jobs em execução serão interrompidos.'))return;await post('/api/reiniciar',{}).catch(()=>{});m.innerHTML='<h2>Reiniciando…</h2><p class="muted">aguarde, a página recarrega sozinha.</p>';
let n=0;const iv=setInterval(async()=>{n++;try{const r=await fetch('/api/resumo');if(r.ok&&n>2){clearInterval(iv);salvaEstado();location.reload()}}catch(e){}if(n>40){clearInterval(iv);m.innerHTML='<h2>Não voltou</h2><p>Abra reiniciar.bat manualmente.</p>'}},1000)}
async function encerrar(){if(!confirm('Encerrar o app? Para voltar, abra iniciar.bat.'))return;await post('/api/encerrar',{}).catch(()=>{});m.innerHTML='<h2>App encerrado</h2><p class="muted">Para voltar, abra iniciar.bat. Pode fechar esta aba.</p>'}

async function universo(){const u=await api('/api/universo');if(!u.funil)throw new Error(u.erro||'servidor desatualizado');const f=u.funil,e=u.edital,hh=u.heuristica;
const B=(n,t,c)=>`<div class="bar"><i class="${c||''}" style="width:${pct(n,t)}%"></i></div>`;
const FN=[['Eventos no catálogo Cebraspe (2016+)',f.eventos,f.eventos],['Provas (cargos) descobertas',f.provas_descobertas,f.provas_descobertas],['Universo-alvo (relevantes ao edital)',f.universo_alvo,f.provas_descobertas],['… já medidas (baixadas e comparadas ao edital)',f.alvo_medidas,f.universo_alvo],['Provas em andamento no workflow',f.em_workflow,f.universo_alvo],['Provas com itens no banco',f.provas_no_banco,f.universo_alvo]];
m.innerHTML=`<h2>Provas: universo × banco</h2>
<div class="cards"><div class="card"><b>${f.provas_descobertas}</b>provas descobertas</div><div class="card"><b>${f.universo_alvo}</b>no universo-alvo</div><div class="card"><b>${f.alvo_a_varrer}</b>do alvo ainda não medidas</div><div class="card"><b>${f.provas_no_banco}</b>provas no banco</div><div class="card"><b>${f.itens_no_banco}</b>itens no banco</div><div class="card"><b>${f.pdfs_locais}</b>PDFs de provas locais</div></div>
<h3>Funil</h3><table>${FN.map(([n,v,t])=>`<tr><td>${n}</td><td>${v}</td><td style="width:35%">${B(v,t)}</td></tr>`).join('')}</table>
<p class="muted">Banco por estado do workflow: ${Object.entries(f.estados_workflow).map(([k,v])=>k+': '+v).join(' · ')}</p>
<h3>Nosso edital</h3><p>${e.pdf?'✔ edital-oficial.pdf presente ('+e.tamanho_kb+' KB, sha256 '+e.sha256+'…)':'✘ edital-oficial.pdf ausente'} · ${e.topicos} tópicos do programa em ${e.secoes} seções · programa.md ${e.programa_md?'✔':'✘'} · regras da prova ${e.regras_md?'✔':'✘'} · léxico de classificação ${e.lexico?'✔':'✘'}</p>
<h3>Como o universo-alvo é escolhido</h3><p class="muted">Cada prova recebe um <i>prior</i> por metadados (palavras do cargo/órgão). Medimos ${f.varridas} provas: contamos os itens "fortes" (que casam com o programa). O rendimento por faixa de prior vira previsão para as não medidas; abaixo da menor faixa medida o rendimento é suposto cair 40% por faixa (faixa "estimada", a corrigir com amostras). Entram no alvo as provas com ≥ ${hh.min_esperado} itens fortes esperados, até ${Math.round(hh.cobertura_massa*100)}% da massa esperada.</p>
<table><tr><th>Faixa de prior</th><th>Candidatas</th><th>Medidas</th><th>Itens fortes/prova</th><th>Origem</th></tr>${Object.entries(hh.faixas).map(([b,x])=>`<tr><td>${b}–${+b+1}</td><td>${x.candidatas}</td><td>${x.n_medidas}</td><td>${x.rend}</td><td>${x.origem=='medida'?'medida':'<span style="color:#d29922">estimada</span>'}</td></tr>`).join('')}</table>
<p class="muted">Dica: varrer 8–10 provas da faixa 2–3 (aba Workflow → varrer) mede esses rendimentos de verdade e ajusta o universo sozinho.</p>
<h3>Representação do edital (seções)</h3><table><tr><th>Seção</th><th>Tema</th><th>Itens compatíveis nas provas medidas</th><th>No banco</th></tr>${u.secoes.map(s=>`<tr><td>${H(capi(s.bloco))}</td><td>${H(s.codigo.split(' ').pop())} ${H(tit(s.topico))}</td><td>${s.compat}${s.compat<10?' ⚠':''}</td><td>${s.banco}</td></tr>`).join('')}</table>
<p class="muted">⚠ = pouco material nas provas medidas: buscar outras provas/bancas para essa seção.</p>
<h3>Provas do universo-alvo (top 300 por rendimento esperado)</h3><input id="fu" placeholder="filtrar por órgão/cargo/estado" oninput="fU()" style="width:100%"><table id="tu"></table>`;
window._U=u.alvo;fU()}
function fU(){const q=(document.getElementById('fu').value||'').toLowerCase();document.getElementById('tu').innerHTML='<tr><th>Ano</th><th>Órgão</th><th>Cargo</th><th>Prior</th><th>Fortes</th><th>Estado</th></tr>'+window._U.filter(r=>(r.orgao+r.cargo+r.estado).toLowerCase().includes(q)).slice(0,120).map(r=>`<tr><td>${r.ano}</td><td>${H(r.orgao)}</td><td>${H((r.cargo||'').slice(0,90))}</td><td>${r.prior}</td><td>${r.esperado}${r.tipo=='estimado'?' ~':''}</td><td>${H(r.estado)}${r.no_banco?' ✔banco':''}</td></tr>`).join('')}

let ED=null,EDSEL=null;
async function edital(){const d=await api('/api/edital');if(!d.topicos)throw new Error(d.erro||'servidor desatualizado');ED=d;const c=d.classificacao;
m.innerHTML=`<h2>Edital × questões</h2>
<div class="cards"><div class="card"><b>${c.itens_extraidos}</b>itens extraídos (${c.provas_varridas} provas)</div><div class="card"><b>${c.compativeis}</b>compatíveis com o edital</div><div class="card"><b>${c.fortes}</b>compatibilidade forte</div><div class="card"><b>${c.no_banco}</b>classificados no banco</div><div class="card"><b>${c.com_tags}</b>com tags de pegadinha</div><div class="card"><b>${c.com_nucleo}</b>com núcleo</div></div>
<p class="muted">Classificação é por lote: só entra no banco o que foi classificado e verificado em duas passagens. Itens extraídos mas ainda não classificados aparecem como "pendentes" em cada tópico. Fora do mapeamento: ${c.sem_codigo_edital} itens do banco sem código do edital (legado) e ${c.fora_do_edital} marcados FORA do edital.</p>
<div style="display:grid;grid-template-columns:minmax(380px,1fr) minmax(380px,1.2fr);gap:16px;align-items:start"><div id="arv"></div><div id="det" style="position:sticky;top:60px;max-height:85vh;overflow:auto"><p class="muted">Clique em um tópico para ver as questões.</p></div></div>`;
const g={};d.topicos.forEach(t=>{(g[t.prova]=g[t.prova]||{});(g[t.prova][t.bloco_titulo]=g[t.prova][t.bloco_titulo]||[]).push(t)});
const NM={P1:'P1 – Conhecimentos básicos',P2:'P2 – Complementares',P3:'P3 – Específicos (TI)'};
$('#arv').innerHTML=Object.entries(g).map(([p,bl])=>`<h3>${NM[p]||p}</h3>`+Object.entries(bl).map(([b,ts])=>{const tb=ts.filter(t=>t.nivel==1).reduce((s,t)=>s+t.banco,0),tc=ts.filter(t=>t.nivel==1).reduce((s,t)=>s+t.compat,0);
return `<details ${p=='P3'?'open':''}><summary style="cursor:pointer;padding:4px 0"><b>${H(b)}</b> <span class="tag">banco ${tb}</span> <span class="tag">compat. ${tc}</span></summary>${ts.map(t=>`<div onclick="edSel('${t.codigo}')" style="cursor:pointer;margin:2px 0 2px ${(t.nivel-1)*18}px;padding:5px 8px;border-radius:6px;background:${t.codigo==EDSEL?'#1f6feb33':'#161b22'};border-left:3px solid ${t.banco?'#3fb950':(t.compat?'#d29922':'#30363d')}">
<span class="muted">${H(t.num)}</span> ${H(t.texto.length>120?t.texto.slice(0,120)+'…':t.texto)} <span class="tag ${t.banco?'ok':''}">${t.banco} no banco</span>${t.compat>t.banco?` <span class="tag rodando">${t.compat-t.banco} pendentes</span>`:''}${t.nucleos?` <span class="tag">${t.nucleos} núcleos</span>`:''}</div>`).join('')}</details>`}).join('')).join('')}
async function edSel(cod){EDSEL=cod;const t=ED.topicos.find(x=>x.codigo==cod);const r=await api('/api/edital-itens?cod='+encodeURIComponent(cod));
$('#det').innerHTML=`<div class="q"><b>${H(RT(cod))}</b><div class="muted" title="${H(cod)}">${H(t.texto)}</div><p class="muted">${r.itens.length} questões no banco · ${t.compat} itens compatíveis encontrados nas provas · ${r.nucleos.length} núcleos</p>
${r.nucleos.length?`<h3>Núcleos (o que a banca testa)</h3><ul>${r.nucleos.map(n=>`<li>${H(n.texto)}</li>`).join('')}</ul>`:''}

<h4>🤖 Filtro 1 · Triagem por ML <span class="muted" style="font-weight:normal;font-size:0.85em">(grátis, roda no seu PC)</span></h4>
<p style="margin:4px 0">O modelo local (TF-IDF + regressão logística) faz uma <b>correspondência de palavras-chave</b> entre o texto da questão e os termos do edital. Ele <b>não lê nem entende</b> a questão — compara frequências de palavras.</p>
<div style="background:#161b22;border-radius:6px;padding:10px 14px;margin-top:8px;font-size:0.9em"><b>Exemplo:</b> se a questão contém "microsserviços" e "API REST", o ML marca como P3·ARQ. Se o texto for genérico ("considere o trecho de código…"), o ML pode errar.<br><br><b>Resultado:</b> recall ~54% na P3 (encontra ~54% das questões P3 que existem no universo), ~83% na P2 — temas com palavras mais específicas são mais fáceis de detectar.</div>
</div>
<div>
<h4>🏷️ Filtro 2 · Classificação por IA <span class="muted" style="font-weight:normal;font-size:0.85em">(gasta tokens, só nos temas escolhidos)</span></h4>
<p style="margin:4px 0">O Claude <b>lê e entende a questão inteira</b> — enunciado, contexto, o que está sendo perguntado — e decide: qual assunto do edital? qual núcleo (ideia central)? qual pegadinha a banca usou?</p>

</div>

 aulas:q('Como dividimos em aulas',`<p>Cada aula tem cerca de <b>${PD.minutos} min de leitura</b>, sem contar o caderno de questões. O app decide a divisão sozinho, em 4 passos:</p><svg viewBox="0 0 620 120" style="width:100%;margin:8px 0"><g font-size="10.5" fill="#e6edf3" text-anchor="middle"><rect x="4" y="22" width="70" height="36" rx="5" fill="#1f6feb55" stroke="#58a6ff"/><text x="39" y="44">bloco A</text><rect x="78" y="22" width="52" height="36" rx="5" fill="#1f6feb55" stroke="#58a6ff"/><text x="104" y="44">bloco B</text><rect x="134" y="22" width="86" height="36" rx="5" fill="#1f6feb55" stroke="#58a6ff"/><text x="177" y="44">bloco C</text><rect x="236" y="22" width="60" height="36" rx="5" fill="#23863655" stroke="#3fb950"/><text x="266" y="44">bloco D</text><rect x="300" y="22" width="92" height="36" rx="5" fill="#23863655" stroke="#3fb950"/><text x="346" y="44">bloco E</text><rect x="408" y="22" width="66" height="36" rx="5" fill="#9e6a0355" stroke="#d29922"/><text x="441" y="44">bloco F</text><rect x="478" y="22" width="130" height="36" rx="5" fill="#9e6a0355" stroke="#d29922"/><text x="543" y="44">bloco G (grande)</text></g><g stroke="#f0883e" stroke-width="2" stroke-dasharray="4 3"><path d="M228 12v56M400 12v56"/></g><g font-size="11" fill="#8b949e" text-anchor="middle"><text x="112" y="86">Aula 1 · ≈ 28 min</text><text x="316" y="86">Aula 2 · ≈ 27 min</text><text x="508" y="86">Aula 3 · ≈ 30 min</text><text x="228" y="108" fill="#f0883e">✂ fronteira do subitem</text><text x="400" y="108" fill="#f0883e">✂ elo mais fraco</text></g></svg><ol><li><b>Custo de cada núcleo:</b> recorrente (cobrado em 2+ provas) ≈ <b>${PD.min_recorrente} min</b> (explicação, exemplo e pegadinha); núcleo único ≈ <b>${PD.min_unico} min</b> (resumo curto). Mais <b>${PD.min_fixo} min</b> por aula para mapa e revisão.</li><li><b>Blocos de ideia:</b> núcleos do mesmo subitem do edital e de texto parecido formam um bloco. <b>Um bloco nunca é partido.</b></li><li><b>Cortes:</b> as aulas são montadas em sequência, e o corte cai de preferência na <b>fronteira entre subitens</b> ou onde o elo entre dois blocos é mais fraco. Procura-se também deixar as aulas com tamanhos parecidos.</li><li><b>Se não couber</b>, a aula fica longa. Não se corta uma ideia ao meio.</li></ol><p>Em média cabem ≈ 18 núcleos por aula (≈ 11 se todos forem recorrentes, até 27 se todos forem únicos).</p><p class="muted"><b>Limites:</b> os tempos são estimativas (≈ 200 palavras por minuto), não medições suas; a coerência é medida pela semelhança dos textos dos núcleos, e a leitura final de "início, meio e fim" acontece quando a aula é escrita. Os valores ficam em <code>parametros-estudo.json</code> (chave <code>aula</code>) e podem ser ajustados com o tempo real que você levar.</p>`),
